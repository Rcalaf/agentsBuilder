services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentsbuilder-postgres
    environment:
      POSTGRES_USER: agentsbuilder
      POSTGRES_PASSWORD: agentsbuilder
      POSTGRES_DB: agentsbuilder
    ports:
      # Host port 5433 avoids clashing with a locally installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - agentsbuilder-pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentsbuilder -d agentsbuilder"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agentsbuilder-pgdata:
