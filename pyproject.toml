[project]
name = "agentsbuilder"
version = "0.0.1"
description = "Build proprietary agentic systems (agents, RAG, tools) on open models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
# Heavy (pulls in ML libraries). Install only when we start document ingestion:
#   uv sync --extra ingest
ingest = ["docling"]

[project.scripts]
agentsbuilder = "agentsbuilder.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsbuilder"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
